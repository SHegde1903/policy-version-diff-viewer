version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: tool_postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-tooldb}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: tool_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask AI Service ─────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tool_ai_service
    ports:
      - "5000:5000"
    environment:
      GROQ_API_KEY:  ${GROQ_API_KEY}
      GROQ_MODEL:    ${GROQ_MODEL:-llama-3.3-70b-versatile}
      REDIS_URL:     redis://redis:6379/0
      AI_PORT:       5000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Spring Boot Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tool_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST:          postgres
      DB_PORT:          5432
      DB_NAME:          ${DB_NAME:-tooldb}
      DB_USER:          ${DB_USER:-postgres}
      DB_PASS:          ${DB_PASS:-postgres}
      AI_SERVICE_URL:   http://ai-service:5000
      JWT_SECRET:       ${JWT_SECRET:-changeme}
      REDIS_HOST:       redis
      REDIS_PORT:       6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: